# Relevance set for offline similarity-ranking evaluation.
#
# Hand-curated by one person (project author) from football knowledge, not
# derived from any model's output or any external dataset -- kept
# independent so scoring against it isn't circular (the same failure mode
# already documented for value_eur (r=0.55 against overall) in
# DECISIONS.md). Still a single person's subjective judgment on a small
# set of players, not a ground-truth benchmark -- treat results as
# indicative, not definitive.
#
# Judgments lean toward same-position/same-role similarity (e.g. Rodri's
# relevant set is other elite defensive midfielders), which is a real bias
# to keep in mind when interpreting v1 vs v2: v2's relaxed outfield filter
# is designed to deviate from same-position similarity on purpose, so this
# relevance set may structurally favor v1.
#
# Format: query player_id -> list of relevant player_ids. Both sides are
# keyed by players.player_id (the PK) rather than short_name, since
# short_name is not unique. short_name is included as a trailing comment
# only, for human readability while editing -- it is never parsed.

dataset_name: curated_v1

